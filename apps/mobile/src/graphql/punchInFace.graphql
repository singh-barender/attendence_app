mutation PunchInFace(
  $userId: ID!
  $embedding: [Float!]!
  $latitude: Float
  $longitude: Float
  $address: String
) {
  punchInFace(
    userId: $userId
    embedding: $embedding
    latitude: $latitude
    longitude: $longitude
    address: $address
  ) {
    matched
    bestScore
    type
    token
    record {
      id
      date
      type
      method
      timestamp
      matchScore
      latitude
      longitude
      address
    }
  }
}
