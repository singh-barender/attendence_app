mutation PunchInFingerprint($userId: ID!, $latitude: Float, $longitude: Float, $address: String) {
  punchInFingerprint(
    userId: $userId
    latitude: $latitude
    longitude: $longitude
    address: $address
  ) {
    matched
    bestScore
    type
    token
    record {
      id
      date
      type
      method
      timestamp
      matchScore
      latitude
      longitude
      address
    }
  }
}
