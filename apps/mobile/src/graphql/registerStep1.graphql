mutation RegisterStep1(
  $email: String!
  $fullName: String!
  $password: String!
  $age: Int
  $gender: String
  $location: String
) {
  registerStep1(
    email: $email
    fullName: $fullName
    password: $password
    age: $age
    gender: $gender
    location: $location
  ) {
    id
    registrationStep
  }
}
