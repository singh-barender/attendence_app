<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Attendance app icon — fingerprint with checkmark</title>
  <defs>
    <!-- Vibrant Neon Gradient for the Fingerprint -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007B" />
    </linearGradient>

    <!-- Glowing Drop Shadow for a 3D Modern Feel -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Central Biometric/Fingerprint Node (Abstracted for modern UI) -->
    <!-- Outer Arc 1 -->
    <path d="M500,900 C300,900 150,750 150,500 C150,250 350,100 500,100 C650,100 850,250 850,500" 
          fill="none" stroke="url(#neonGradient)" stroke-width="60" stroke-linecap="round" />
    
    <!-- Inner Arc 1 -->
    <path d="M500,750 C380,750 280,630 280,500 C280,350 400,230 500,230 C600,230 720,350 720,500" 
          fill="none" stroke="url(#neonGradient)" stroke-width="60" stroke-linecap="round" />
    
    <!-- Center Loop / Node -->
    <path d="M500,600 C450,600 410,550 410,500 C410,430 460,360 500,360 C540,360 590,430 590,500 L590,800" 
          fill="none" stroke="url(#neonGradient)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Modern Checkmark overlaying the fingerprint to signify Attendance/Verification -->
    <path d="M 350,550 L 480,680 L 800,350" 
          fill="none" stroke="#FFFFFF" stroke-width="75" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
