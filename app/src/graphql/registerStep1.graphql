mutation RegisterStep1(
  $email: String!
  $fullName: String!
  $password: String!
  $age: Int
  $gender: String
) {
  registerStep1(
    email: $email
    fullName: $fullName
    password: $password
    age: $age
    gender: $gender
  ) {
    token
    user {
      id
      registrationStep
    }
  }
}
